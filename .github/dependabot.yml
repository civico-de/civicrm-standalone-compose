# Proposes newer image tags in compose.yaml and newer action versions. CIVICRM_VERSION lives in
# .env.example and tests/test.env, which Dependabot does not read; the weekly "latest" test run covers it.
version: 2
updates:
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    ignore:
      # The tag names an LTS line and brings its patches on every pull. Most newer lines are
      # short-term releases, so moving to the next LTS stays a decision made in compose.yaml.
      - dependency-name: mariadb
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
